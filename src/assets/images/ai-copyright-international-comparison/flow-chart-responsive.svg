<svg viewBox="0 0 900 500" xmlns="http://www.w3.org/2000/svg" style="width: 100%; height: auto; max-width: 900px;">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2c3e50"/>
    </marker>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3498db;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2980b9;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#e74c3c;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#c0392b;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#27ae60;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#229954;stop-opacity:1" />
    </linearGradient>
    
    <!-- 響應式字體大小 -->
    <style>
      @media (max-width: 768px) {
        .title { font-size: 16px !important; }
        .subtitle { font-size: 12px !important; }
        .step-title { font-size: 10px !important; }
        .step-desc { font-size: 8px !important; }
        .bottom-text { font-size: 10px !important; }
        .suggestion { font-size: 9px !important; }
      }
      @media (max-width: 480px) {
        .title { font-size: 14px !important; }
        .subtitle { font-size: 10px !important; }
        .step-title { font-size: 8px !important; }
        .step-desc { font-size: 7px !important; }
        .bottom-text { font-size: 8px !important; }
        .suggestion { font-size: 7px !important; }
      }
    </style>
  </defs>
  
  <!-- 背景 -->
  <rect width="900" height="500" fill="#f8f9fa"/>
  
  <!-- 標題 -->
  <text x="450" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#2c3e50" class="title">
    AI資料擷取法律處理流程比較
  </text>
  
  <!-- 台灣流程 -->
  <text x="200" y="60" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#e74c3c" class="subtitle">台灣流程</text>
  
  <!-- 台灣步驟 -->
  <rect x="50" y="80" width="120" height="60" fill="url(#grad1)" rx="8"/>
  <text x="110" y="105" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white" class="step-title">AI企業</text>
  <text x="110" y="120" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white" class="step-desc">資料擷取</text>
  
  <rect x="50" y="160" width="120" height="60" fill="url(#grad2)" rx="8"/>
  <text x="110" y="185" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white" class="step-title">刑事起訴</text>
  <text x="110" y="200" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white" class="step-desc">徒刑+罰金</text>
  
  <rect x="50" y="240" width="120" height="60" fill="url(#grad2)" rx="8"/>
  <text x="110" y="265" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white" class="step-title">民事賠償</text>
  <text x="110" y="280" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white" class="step-desc">高額賠償</text>
  
  <rect x="50" y="320" width="120" height="60" fill="url(#grad2)" rx="8"/>
  <text x="110" y="345" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white" class="step-title">創新受阻</text>
  <text x="110" y="360" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white" class="step-desc">產業外流</text>
  
  <!-- 台灣箭頭 -->
  <line x1="110" y1="140" x2="110" y2="160" stroke="#2c3e50" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="110" y1="220" x2="110" y2="240" stroke="#2c3e50" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="110" y1="300" x2="110" y2="320" stroke="#2c3e50" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- 國際流程 -->
  <text x="700" y="60" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#27ae60" class="subtitle">國際流程</text>
  
  <!-- 國際步驟 -->
  <rect x="550" y="80" width="120" height="60" fill="url(#grad1)" rx="8"/>
  <text x="610" y="105" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white" class="step-title">AI企業</text>
  <text x="610" y="120" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white" class="step-desc">資料擷取</text>
  
  <rect x="550" y="160" width="120" height="60" fill="url(#grad3)" rx="8"/>
  <text x="610" y="185" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white" class="step-title">TDM例外</text>
  <text x="610" y="200" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white" class="step-desc">合法使用</text>
  
  <rect x="550" y="240" width="120" height="60" fill="url(#grad3)" rx="8"/>
  <text x="610" y="265" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white" class="step-title">民事爭議</text>
  <text x="610" y="280" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white" class="step-desc">合理使用</text>
  
  <rect x="550" y="320" width="120" height="60" fill="url(#grad3)" rx="8"/>
  <text x="610" y="345" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white" class="step-title">創新發展</text>
  <text x="610" y="360" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white" class="step-desc">產業成長</text>
  
  <!-- 國際箭頭 -->
  <line x1="610" y1="140" x2="610" y2="160" stroke="#2c3e50" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="610" y1="220" x2="610" y2="240" stroke="#2c3e50" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="610" y1="300" x2="610" y2="320" stroke="#2c3e50" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- 中間比較 -->
  <text x="450" y="420" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2c3e50" class="bottom-text">
    關鍵差異：刑事處罰 vs 民事調解
  </text>
  
  <!-- 政策建議 -->
  <rect x="300" y="440" width="300" height="40" fill="#f39c12" rx="8"/>
  <text x="450" y="460" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white" class="suggestion">
    建議：增訂TDM例外 + 建立產業沙盒
  </text>
</svg> 