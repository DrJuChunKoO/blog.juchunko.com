<svg viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg" style="width: 100%; height: auto; max-width: 800px;">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#4A90E2;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#357ABD;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#E74C3C;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#C0392B;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#27AE60;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#229954;stop-opacity:1" />
    </linearGradient>
    
    <!-- 響應式字體大小 -->
    <style>
      @media (max-width: 768px) {
        .title { font-size: 16px !important; }
        .country-label { font-size: 12px !important; }
        .policy-label { font-size: 10px !important; }
        .cell-text { font-size: 8px !important; }
        .legend-text { font-size: 10px !important; }
      }
      @media (max-width: 480px) {
        .title { font-size: 14px !important; }
        .country-label { font-size: 10px !important; }
        .policy-label { font-size: 8px !important; }
        .cell-text { font-size: 7px !important; }
        .legend-text { font-size: 8px !important; }
      }
    </style>
  </defs>
  
  <!-- 背景 -->
  <rect width="800" height="400" fill="#f8f9fa"/>
  
  <!-- 標題 -->
  <text x="400" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#2c3e50" class="title">
    AI著作權政策國際比較
  </text>
  
  <!-- 國家標籤 -->
  <text x="50" y="80" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2c3e50" class="country-label">台灣</text>
  <text x="50" y="120" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2c3e50" class="country-label">美國</text>
  <text x="50" y="160" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2c3e50" class="country-label">日本</text>
  <text x="50" y="200" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2c3e50" class="country-label">新加坡</text>
  <text x="50" y="240" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2c3e50" class="country-label">歐盟</text>
  <text x="50" y="280" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2c3e50" class="country-label">英國</text>
  
  <!-- 政策類型標籤 -->
  <text x="150" y="60" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#7f8c8d" class="policy-label">刑事處罰</text>
  <text x="300" y="60" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#7f8c8d" class="policy-label">民事賠償</text>
  <text x="450" y="60" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#7f8c8d" class="policy-label">TDM例外</text>
  <text x="600" y="60" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#7f8c8d" class="policy-label">產業沙盒</text>
  
  <!-- 台灣 - 高刑事處罰 -->
  <rect x="150" y="70" width="80" height="20" fill="url(#grad2)" rx="3"/>
  <text x="190" y="83" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white" class="cell-text">高</text>
  
  <!-- 美國 - 民事為主 -->
  <rect x="300" y="110" width="80" height="20" fill="url(#grad1)" rx="3"/>
  <text x="340" y="123" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white" class="cell-text">民事</text>
  
  <!-- 日本 - TDM例外 -->
  <rect x="450" y="150" width="80" height="20" fill="url(#grad3)" rx="3"/>
  <text x="490" y="163" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white" class="cell-text">有</text>
  
  <!-- 新加坡 - 明確例外 -->
  <rect x="450" y="190" width="80" height="20" fill="url(#grad3)" rx="3"/>
  <text x="490" y="203" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white" class="cell-text">有</text>
  
  <!-- 歐盟 - 兩層例外 -->
  <rect x="450" y="230" width="80" height="20" fill="url(#grad1)" rx="3"/>
  <text x="490" y="243" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white" class="cell-text">部分</text>
  
  <!-- 英國 - 諮詢中 -->
  <rect x="600" y="270" width="80" height="20" fill="url(#grad1)" rx="3"/>
  <text x="640" y="283" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white" class="cell-text">規劃中</text>
  
  <!-- 圖例 -->
  <rect x="50" y="320" width="15" height="15" fill="url(#grad2)" rx="2"/>
  <text x="75" y="332" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50" class="legend-text">高刑事處罰</text>
  
  <rect x="200" y="320" width="15" height="15" fill="url(#grad1)" rx="2"/>
  <text x="225" y="332" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50" class="legend-text">民事為主</text>
  
  <rect x="350" y="320" width="15" height="15" fill="url(#grad3)" rx="2"/>
  <text x="375" y="332" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50" class="legend-text">有TDM例外</text>
</svg> 